<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Production retrieval-augmented generation pipeline</title>
  <desc id="desc">Documents are parsed, chunked, embedded, and indexed. A query is authorized, searched with dense and lexical retrieval, reranked, and passed with evidence to a language model for a cited answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101b36"/>
      <stop offset="1" stop-color="#1d3158"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8db7ff"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="48" y="48" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Ground answers in authorized, relevant evidence</text>
  <text x="48" y="73" fill="#b9c8e5" font-family="Arial,sans-serif" font-size="14">Separate document indexing from query-time retrieval; enforce access before context reaches the model.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="48" y="111" fill="#62d6bd" font-size="13" font-weight="700" text-anchor="start">OFFLINE INDEXING</text>
    <g fill="#263f68" stroke="#75a7ff">
      <rect x="48" y="126" width="150" height="70" rx="12"/>
      <rect x="250" y="126" width="150" height="70" rx="12"/>
      <rect x="452" y="126" width="150" height="70" rx="12"/>
      <rect x="654" y="126" width="150" height="70" rx="12"/>
    </g>
    <g fill="#fff" font-size="15" font-weight="700">
      <text x="123" y="157">Source docs</text><text x="123" y="179" fill="#d3def2" font-size="12" font-weight="400">Parse + version</text>
      <text x="325" y="157">Chunk</text><text x="325" y="179" fill="#d3def2" font-size="12" font-weight="400">Preserve structure</text>
      <text x="527" y="157">Embed</text><text x="527" y="179" fill="#d3def2" font-size="12" font-weight="400">Attach metadata</text>
      <text x="729" y="157">Index</text><text x="729" y="179" fill="#d3def2" font-size="12" font-weight="400">Dense + lexical</text>
    </g>
    <path d="M202 161h40M404 161h40M606 161h40" fill="none" stroke="#8db7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="48" y="235" fill="#ffc979" font-size="13" font-weight="700" text-anchor="start">ONLINE QUERY</text>
    <g fill="#3a355d" stroke="#c1a8ff">
      <rect x="48" y="250" width="140" height="70" rx="12"/>
      <rect x="235" y="250" width="140" height="70" rx="12"/>
      <rect x="422" y="250" width="140" height="70" rx="12"/>
      <rect x="609" y="250" width="140" height="70" rx="12"/>
      <rect x="796" y="250" width="140" height="70" rx="12"/>
      <rect x="983" y="250" width="170" height="70" rx="12"/>
    </g>
    <g fill="#fff" font-size="14" font-weight="700">
      <text x="118" y="279">User query</text><text x="118" y="300" fill="#e0d8f5" font-size="11" font-weight="400">Authenticate</text>
      <text x="305" y="279">Authorize</text><text x="305" y="300" fill="#e0d8f5" font-size="11" font-weight="400">Tenant + role filter</text>
      <text x="492" y="279">Hybrid search</text><text x="492" y="300" fill="#e0d8f5" font-size="11" font-weight="400">Dense + BM25 + RRF</text>
      <text x="679" y="279">Rerank</text><text x="679" y="300" fill="#e0d8f5" font-size="11" font-weight="400">Select evidence</text>
      <text x="866" y="279">Generate</text><text x="866" y="300" fill="#e0d8f5" font-size="11" font-weight="400">Grounded prompt</text>
      <text x="1068" y="279">Answer + sources</text><text x="1068" y="300" fill="#e0d8f5" font-size="11" font-weight="400">Verify + observe</text>
    </g>
    <path d="M192 285h35M379 285h35M566 285h35M753 285h35M940 285h35" fill="none" stroke="#c1a8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M729 197C729 221 492 218 492 244" fill="none" stroke="#62d6bd" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>
</svg>
