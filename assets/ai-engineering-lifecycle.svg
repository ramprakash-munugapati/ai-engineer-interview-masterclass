<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">AI engineering lifecycle</title>
  <desc id="desc">Five iterative stages: define the problem, build the data and model, evaluate, deploy, and monitor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101b36"/>
      <stop offset="1" stop-color="#1d3158"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8db7ff"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="54" y="52" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Build AI for real-world outcomes</text>
  <text x="54" y="79" fill="#b9c8e5" font-family="Arial,sans-serif" font-size="15">A production lifecycle is a feedback loop, not a one-way model handoff.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g>
      <rect x="48" y="119" width="190" height="100" rx="15" fill="#263f68" stroke="#75a7ff"/>
      <circle cx="78" cy="149" r="15" fill="#75a7ff"/>
      <text x="78" y="154" fill="#102040" font-size="14" font-weight="700">1</text>
      <text x="143" y="158" fill="#fff" font-size="17" font-weight="700">Define</text>
      <text x="143" y="184" fill="#d3def2" font-size="13">User need + success metric</text>
    </g>
    <path d="M242 169h38" fill="none" stroke="#8db7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="292" y="119" width="190" height="100" rx="15" fill="#263f68" stroke="#75a7ff"/>
      <circle cx="322" cy="149" r="15" fill="#75a7ff"/>
      <text x="322" y="154" fill="#102040" font-size="14" font-weight="700">2</text>
      <text x="387" y="158" fill="#fff" font-size="17" font-weight="700">Build</text>
      <text x="387" y="184" fill="#d3def2" font-size="13">Data + retrieval + model</text>
    </g>
    <path d="M486 169h38" fill="none" stroke="#8db7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="536" y="119" width="190" height="100" rx="15" fill="#263f68" stroke="#75a7ff"/>
      <circle cx="566" cy="149" r="15" fill="#75a7ff"/>
      <text x="566" y="154" fill="#102040" font-size="14" font-weight="700">3</text>
      <text x="631" y="158" fill="#fff" font-size="17" font-weight="700">Evaluate</text>
      <text x="631" y="184" fill="#d3def2" font-size="13">Quality + safety + cost</text>
    </g>
    <path d="M730 169h38" fill="none" stroke="#8db7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="780" y="119" width="160" height="100" rx="15" fill="#263f68" stroke="#75a7ff"/>
      <circle cx="810" cy="149" r="15" fill="#75a7ff"/>
      <text x="810" y="154" fill="#102040" font-size="14" font-weight="700">4</text>
      <text x="865" y="158" fill="#fff" font-size="17" font-weight="700">Deploy</text>
      <text x="860" y="184" fill="#d3def2" font-size="13">Canary + rollback</text>
    </g>
    <path d="M944 169h38" fill="none" stroke="#8db7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="994" y="119" width="160" height="100" rx="15" fill="#263f68" stroke="#75a7ff"/>
      <circle cx="1024" cy="149" r="15" fill="#75a7ff"/>
      <text x="1024" y="154" fill="#102040" font-size="14" font-weight="700">5</text>
      <text x="1080" y="158" fill="#fff" font-size="17" font-weight="700">Monitor</text>
      <text x="1074" y="184" fill="#d3def2" font-size="13">Outcomes + drift</text>
    </g>
  </g>
  <path d="M1070 238C1070 274 130 274 130 238" fill="none" stroke="#62d6bd" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="600" y="268" fill="#9ce8d8" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Use production evidence to improve the next iteration</text>
</svg>
